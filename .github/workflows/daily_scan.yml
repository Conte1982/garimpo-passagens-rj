name: Garimpo Diario de Passagens

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Navegador Chromium do Playwright
        run: playwright install --with-deps chromium

      - name: Executar robô de busca
        run: python bot_passagens.py

      - name: Salvar resultados e atualizar repositório
        run: |
          git config --global user.name "Bot Garimpeiro"
          git config --global user.email "bot@github.com"
          git add flights.json
          git commit -m "Atualização diária de passagens com Playwright [skip ci]" || exit 0
          git push
